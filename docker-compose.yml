# Prod-стек. Локальная проверка: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
name: memequiz

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: memequiz-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    # наружу только 443: сертификат выпускается через TLS-ALPN-01, порт 80 не нужен
    ports:
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: memequiz-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TG_INIT_DATA_TTL: ${TG_INIT_DATA_TTL:-86400}
      BOT_ENABLED: ${BOT_ENABLED:-true}
      WEB_APP_URL: https://${SITE_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # порт наружу не публикуется: доступ только из сети compose
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  pgdata:
  # те же имена, что у Caddy из этапа 0: уже выпущенный сертификат переиспользуется
  caddy_data:
  caddy_config:
